[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-system"
version = "0.1.0"
description = "PaySim data foundation for a modular monolith fraud detection system"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "pyarrow>=15,<24"]

[project.optional-dependencies]
download = ["kaggle>=1.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fraud_detection.data_foundation" = ["feature_policy.md"]

